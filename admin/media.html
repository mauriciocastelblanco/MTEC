<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin MTEC — Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .media-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .media-card .thumb { aspect-ratio: 4/3; background: rgba(0,0,0,0.30); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .media-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .media-card .thumb svg { width: 32px; height: 32px; color: var(--platino); }
  .media-card .meta { padding: 10px 12px; }
  .media-card .meta strong { display: block; font-size: 12.5px; color: var(--vapor); margin-bottom: 2px; word-break: break-word; }
  .media-card .meta span { font-size: 11.5px; color: var(--plomo); }
</style>
</head>
<body>

<div class="admin-shell">

  <aside class="sidebar">
    <div class="sidebar-logo"><img src="../deliverables/logos/PNG/Logo MTEC_final_Blanco.png" alt="MTEC"></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Servicios
      </a>
      <a href="media.html" class="sidebar-item is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Media
      </a>
      <a href="config.html" class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuración
      </a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-foot">
      <a href="../index.html" class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver al sitio público
      </a>
      <a href="#" class="sidebar-item" data-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-breadcrumb"><span class="current">Media</span></div>
      <div class="topbar-user" data-user-chip>·</div>
    </div>
<div class="admin-content">
      <h1>Media</h1>
      <p class="page-description">Resumen de las imágenes y PDFs que tus servicios están usando hoy.</p>
      <div class="media-grid" id="mediaGrid"></div>
    </div>
  </main>
</div>

<script type="module" src="assets/js/auth-init.js"></script>
<script type="module">
import { getServicios } from './assets/js/admin-data.js';

const grid = document.getElementById('mediaGrid');
const servicios = await getServicios();
const cards = [];

const PDF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

servicios.forEach(s => {
  if (s.hero?.imagen) cards.push({ thumb: s.hero.imagen, name: 'Hero', service: s.titulo, type: 'imagen' });
  if (s.hero?.productCallout?.imagen) cards.push({ thumb: s.hero.productCallout.imagen, name: s.hero.productCallout.nombreProducto || 'Producto', service: s.titulo, type: 'imagen' });
  if (s.certificacion?.fichaTecnicaPdf) cards.push({ thumb: null, name: s.certificacion.fichaTecnicaPdf.nombre, service: s.titulo, type: 'pdf' });
  if (s.certificacion?.certificadosPdf) cards.push({ thumb: null, name: s.certificacion.certificadosPdf.nombre, service: s.titulo, type: 'pdf' });
  (s.galeria || []).forEach((g, i) => {
    if (g.dataUrl) cards.push({ thumb: g.dataUrl, name: g.caption || `Galería ${i + 1}`, service: s.titulo, type: 'imagen' });
  });
});

grid.innerHTML = cards.length === 0
  ? '<p style="color:var(--plomo)">Aún no hay archivos. Crea o edita un servicio para agregar imágenes y PDFs.</p>'
  : cards.map(c => `
    <div class="media-card">
      <div class="thumb">${c.thumb ? `<img src="${escapeHtml(c.thumb)}" alt="">` : PDF_ICON}</div>
      <div class="meta">
        <strong>${escapeHtml(c.name)}</strong>
        <span>${escapeHtml(c.service)} · ${escapeHtml(c.type)}</span>
      </div>
    </div>
  `).join('');
</script>

</body>
</html>
