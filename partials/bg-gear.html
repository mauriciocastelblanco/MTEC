<!-- ══ BACKGROUND GEAR — procedural blueprint/HUD ══
     Canonical version (matches Quiénes Somos hero).
     Geometry built by assets/js/bg-gear.js into #gearOuterShape & #gearBodyShape.
     Inner spin group #bgGearLeft rotates on scroll. -->
<div class="bg-gears" aria-hidden="true">
  <div class="bg-gear bg-gear--left">
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Body fill — anodized blue with stronger presence -->
        <linearGradient id="bodyGrad" x1="10%" y1="92%" x2="92%" y2="8%">
          <stop offset="0%"   stop-color="#0B3554" stop-opacity="0.82"/>
          <stop offset="35%"  stop-color="#155A88" stop-opacity="0.72"/>
          <stop offset="70%"  stop-color="#1B6CA8" stop-opacity="0.58"/>
          <stop offset="100%" stop-color="#2B82B9" stop-opacity="0.52"/>
        </linearGradient>

        <!-- Soft radial specular at upper-left -->
        <radialGradient id="specularGrad" cx="30%" cy="26%" r="65%">
          <stop offset="0%"   stop-color="#D6DEE6" stop-opacity="0.32"/>
          <stop offset="55%"  stop-color="#2F91C9" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#0E4E78" stop-opacity="0"/>
        </radialGradient>

        <!-- Halftone dot pattern — blueprint background texture -->
        <pattern id="dotPattern" width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="0.65" fill="#D6DEE6" fill-opacity="0.42"/>
        </pattern>

        <!-- Denser halftone for inner zone -->
        <pattern id="dotPatternDense" width="5" height="5" patternUnits="userSpaceOnUse">
          <circle cx="2.5" cy="2.5" r="0.45" fill="#D6DEE6" fill-opacity="0.55"/>
        </pattern>

        <!-- Horizontal scan lines (CRT/sci-fi feel) -->
        <pattern id="scanPattern" width="4" height="4" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0.5" x2="4" y2="0.5" stroke="#D6DEE6" stroke-width="0.32" stroke-opacity="0.11"/>
        </pattern>

        <!-- Halftone vignette mask — denser dots at center, fade to edge -->
        <radialGradient id="halftoneMaskGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%"  stop-color="#fff" stop-opacity="1"/>
          <stop offset="55%" stop-color="#fff" stop-opacity="0.70"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="halftoneMask">
          <rect width="1000" height="1000" fill="url(#halftoneMaskGrad)"/>
        </mask>

        <!-- Soft glow for HUD nodes -->
        <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Stronger glow for crescent specular arcs -->
        <filter id="crescentGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>

        <!-- Procedural body paths (d attribute set by JS) -->
        <path id="gearOuterShape"/>
        <path id="gearBodyShape"/>

        <clipPath id="gearBodyClip">
          <use href="#gearBodyShape" style="fill-rule:evenodd"/>
        </clipPath>
        <clipPath id="gearOuterClip">
          <use href="#gearOuterShape"/>
        </clipPath>
      </defs>

      <g class="bg-gear-spin" id="bgGearLeft">
        <use href="#gearBodyShape" fill="url(#bodyGrad)" style="fill-rule:evenodd"/>
        <g clip-path="url(#gearBodyClip)">
          <rect width="1000" height="1000" fill="url(#dotPattern)"/>
        </g>
        <g clip-path="url(#gearBodyClip)">
          <rect width="1000" height="1000" fill="url(#specularGrad)"/>
        </g>
        <g clip-path="url(#gearBodyClip)">
          <rect width="1000" height="1000" fill="url(#scanPattern)"/>
        </g>
        <circle cx="500" cy="500" r="195" fill="none" stroke="rgba(236, 242, 248, 0.55)" stroke-width="0.6"/>
        <circle cx="500" cy="500" r="175" fill="none" stroke="rgba(220, 228, 236, 0.72)" stroke-width="0.85"/>
        <circle cx="500" cy="500" r="150" fill="none" stroke="rgba(236, 242, 248, 0.85)" stroke-width="0.9"/>
        <circle cx="500" cy="500" r="132" fill="none" stroke="rgba(178, 190, 201, 0.32)" stroke-width="0.45" stroke-dasharray="3 6"/>
        <circle cx="500" cy="500" r="116" fill="none" stroke="rgba(220, 228, 236, 0.55)" stroke-width="0.60"/>
        <circle cx="500" cy="500" r="102" fill="none" stroke="rgba(178, 190, 201, 0.32)" stroke-width="0.42" stroke-dasharray="2 4"/>
        <circle cx="500" cy="500" r="90"  fill="none" stroke="rgba(220, 228, 236, 0.62)" stroke-width="0.65"/>
        <line x1="500" y1="-50" x2="500" y2="1050" stroke="rgba(178, 190, 201, 0.22)" stroke-width="0.5" stroke-dasharray="6 10"/>
        <line x1="-50" y1="500" x2="1050" y2="500" stroke="rgba(178, 190, 201, 0.22)" stroke-width="0.5" stroke-dasharray="6 10"/>
        <line x1="100" y1="100" x2="900" y2="900" stroke="rgba(178, 190, 201, 0.12)" stroke-width="0.4" stroke-dasharray="4 8"/>
        <line x1="100" y1="900" x2="900" y2="100" stroke="rgba(178, 190, 201, 0.12)" stroke-width="0.4" stroke-dasharray="4 8"/>
        <use href="#gearBodyShape" fill="none"
             stroke="rgba(236, 242, 248, 0.82)" stroke-width="1.0"
             stroke-linejoin="round"
             style="fill-rule:evenodd; mix-blend-mode:screen"/>
        <g id="gearTicks"></g>
        <path d="M 500,305 A 195 195 0 0 1 695,500"
              fill="none" stroke="rgba(255, 255, 255, 0.92)" stroke-width="1.4"
              stroke-linecap="round" style="mix-blend-mode:screen"/>
        <path d="M 510,312 A 190 190 0 0 1 688,490"
              fill="none" stroke="rgba(236, 242, 248, 0.55)" stroke-width="0.55"
              stroke-linecap="round"/>
        <path d="M 500,350 A 150 150 0 0 1 650,500"
              fill="none" stroke="rgba(236, 242, 248, 0.65)" stroke-width="0.9"
              stroke-linecap="round" style="mix-blend-mode:screen"/>
        <path d="M 500,695 A 195 195 0 0 1 305,500"
              fill="none" stroke="rgba(178, 190, 201, 0.30)" stroke-width="0.6"
              stroke-linecap="round" style="mix-blend-mode:screen"/>
        <g id="gearReticle"></g>
        <g id="gearNodes"></g>
        <circle cx="500" cy="500" r="6" fill="rgba(236, 242, 248, 0.45)" filter="url(#nodeGlow)"/>
        <circle cx="500" cy="500" r="2.5" fill="#FFFFFF"/>
        <line x1="490" y1="500" x2="494" y2="500" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
        <line x1="506" y1="500" x2="510" y2="500" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
        <line x1="500" y1="490" x2="500" y2="494" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
        <line x1="500" y1="506" x2="500" y2="510" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
</div>
