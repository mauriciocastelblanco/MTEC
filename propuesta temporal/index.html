<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTEC — Tecnología & Innovación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,500;0,600;0,700;1,300;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { line-height: 1.15; -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", sans-serif;
    background: #0D1B2E;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100svh;
  }
  img { max-width: 100%; display: block; }

  /* ── VIDEO ── */
  .hero-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.38;
    z-index: 0;
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(5,10,18,0.75) 100%),
      linear-gradient(to bottom, rgba(5,10,18,0.4) 0%, transparent 25%, transparent 70%, rgba(5,10,18,0.95) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Spotlight beam — centered */
  .beam {
    position: fixed;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 320px solid transparent;
    border-right: 320px solid transparent;
    border-top: 100vh solid rgba(178,190,201,0.045);
    pointer-events: none;
    filter: blur(28px);
    z-index: 1;
  }
  .beam-2 {
    position: fixed;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-top: 60vh solid rgba(178,190,201,0.08);
    pointer-events: none;
    filter: blur(10px);
    z-index: 1;
  }
  .ceiling-glow {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 100px;
    background: radial-gradient(ellipse at 50% 0%, rgba(178,190,201,0.35) 0%, rgba(178,190,201,0.08) 45%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 80px;
    display: flex;
    align-items: center;
    padding: 0 48px;
    z-index: 50;
  }
  .nav-pill {
    margin-left: auto;
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #fff;
    padding: 5px 14px;
    border: 1px solid rgba(178,190,201,0.2);
    opacity: 0;
    animation: fadeIn 0.5s ease forwards 0.2s;
  }

  /* ── MAIN CONTENT ── */
  main {
    position: relative;
    z-index: 10;
    height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 40px 60px;
    gap: 0;
  }

  /* Logo */
  .hero-logo {
    width: clamp(180px, 22vw, 320px);
    height: auto;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(24px);
    animation: up 1s cubic-bezier(0.16,1,0.3,1) forwards 0.35s;
  }

  /* Animated rule */
  .rule {
    width: clamp(280px, 50vw, 640px);
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(178,190,201,0.5) 30%, rgba(178,190,201,0.5) 70%, transparent 100%);
    transform-origin: center;
    transform: scaleX(0);
    margin-bottom: 28px;
    animation: drawLine 1s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
  }
  @keyframes drawLine { to { transform: scaleX(1); } }

  /* Sector tags */
  .sectors {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.26em;
    color: rgba(178,190,201,0.5);
    text-transform: uppercase;
    margin-bottom: 52px;
    opacity: 0;
    transform: translateY(8px);
    animation: up 0.6s ease forwards 1.1s;
  }

  /* Main statement */
  .statement {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(24px, 3.2vw, 44px);
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: #fff;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(32px);
    animation: up 1s cubic-bezier(0.16,1,0.3,1) forwards 1.25s;
    position: relative;
  }

  /* Subtle glow behind the big text */
  .statement::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: transparent;
    filter: blur(40px);
    background: linear-gradient(135deg, rgba(27,108,168,0.3), rgba(178,190,201,0.15));
    -webkit-background-clip: text;
    background-clip: text;
    z-index: -1;
  }

  /* Cursor */
  .hero-cursor {
    display: inline-block;
    width: 0.06em;
    height: 0.8em;
    background: #1B6CA8;
    vertical-align: middle;
    margin-left: 4px;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Bottom accent line */
  .accent-line {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #1B6CA8 35%, #4A9FD5 65%, transparent);
    opacity: 0.7;
    z-index: 50;
  }

  /* animations */
  @keyframes up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    header { padding: 0 24px; }
    main { padding: 80px 24px 48px; }
    .statement { font-size: clamp(56px, 16vw, 96px); }
  }
</style>
</head>
<body>

<video class="hero-video" autoplay muted loop playsinline>
  <source src="brand_assets/video_3df4ad65-fd77-4de5-b448-83538ec2e73a.mp4" type="video/mp4">
</video>
<div class="vignette"></div>
<div class="beam"></div>
<div class="beam-2"></div>
<div class="ceiling-glow"></div>
<div class="accent-line"></div>

<!-- HEADER -->
<header>
  <img src="brand_assets/Logo_MTEC-blanco.png" alt="MTEC" style="height: 40px; width: auto; opacity:0; animation: fadeIn 0.5s ease forwards 0.1s;">
  <div class="nav-pill">Próximamente</div>
</header>

<!-- MAIN -->
<main>
  <img class="hero-logo" src="brand_assets/Logo_MTEC-blanco.png" alt="MTEC">
  <div class="rule"></div>
  <div class="sectors">Oil & Gas &nbsp;·&nbsp; Energía &nbsp;·&nbsp; Minería &nbsp;·&nbsp; Industrias</div>
  <div class="statement" data-text="Sitio en renovación">Sitio en renovación<span class="hero-cursor"></span></div>
</main>

</body>
</html>
